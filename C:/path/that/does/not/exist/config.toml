version = 1
default_shell = "zsh"

[ui]
show_project_explorer = true
project_explorer_expanded = true
show_terminal_manager = true
terminal_manager_expanded = true
multi_terminal_view_enabled = false
terminal_manager_filter = "foreground"
last_selected_project_id = 9
main_visibility_mode = "global"
left_sidebar_tab = "directory"

[[launchers]]
id = "opencode"
builtin = "open_code"
display_name = "OpenCode"
launch_command = "opencode"
enabled = true
icon_key = "open_code"

[[launchers]]
id = "codex"
builtin = "codex"
display_name = "Codex"
launch_command = "codex"
enabled = true
icon_key = "codex"

[[launchers]]
id = "droid"
builtin = "droid"
display_name = "Droid"
launch_command = "droid"
enabled = true
icon_key = "droid"

[[launchers]]
id = "claude"
builtin = "claude"
display_name = "Claude"
launch_command = "claude"
enabled = true
icon_key = "claude"

[[projects]]
id = 9
name = "Keep"
path = "C:/keep"
saved_messages = []

[projects.ai_config]
hooks_enabled = false

[projects.ai_config.tool_overrides]

[ai_hooks]
global_enabled = true

[[ai_hooks.hooks]]
tool = "factory_droid"
enabled = true
detection_commands = [
    "droid",
    "factory",
]
running_hook_events = ["UserPromptSubmit"]
inactive_hook_events = [
    "Stop",
    "Notification",
    "idle_prompt",
    "permission_prompt",
]
show_indicators = true
working_title_pattern = "[Working"
idle_title_pattern = "[Idle]"

[ai_hooks.hooks.status_indicators]
idle = "○"
running = "●"

[[ai_hooks.hooks]]
tool = "codex_cli"
enabled = true
detection_commands = []
running_hook_events = []
inactive_hook_events = []
show_indicators = true
working_title_pattern = ""
idle_title_pattern = ""

[ai_hooks.hooks.status_indicators]
idle = "○"
running = "●"

[[ai_hooks.hooks]]
tool = "open_code"
enabled = true
detection_commands = ["opencode"]
running_hook_events = []
inactive_hook_events = []
show_indicators = true
working_title_pattern = ""
idle_title_pattern = ""

[ai_hooks.hooks.status_indicators]
idle = "○"
running = "●"

[ai_hooks.project_overrides]
