                - generic [ref=e375]:
                  - heading "Subagent Usage Policy" [level=2] [ref=e376]
                  - 'link "Permalink: Subagent Usage Policy" [ref=e377] [cursor=pointer]':
                    - /url: "#subagent-usage-policy"
                    - img [ref=e378]
                - list [ref=e380]:
                  - listitem [ref=e381]: For any non-trivial implementation, debugging, or review task, use subagents instead of running everything in a single agent.
                  - listitem [ref=e382]:
                    - text: "When work can be split safely, delegate independent parts in parallel (for example:"
                    - code [ref=e383]: explorer
                    - text: for discovery,
                    - code [ref=e384]: fast_code
                    - text: for implementation,
                    - code [ref=e385]: test
                    - text: for verification,
                    - code [ref=e386]: reviewer
                    - text: for risk checks).
                  - listitem [ref=e387]: Respect the configured concurrency limit and do not exceed 4 parallel subagent threads.
                  - listitem [ref=e388]: Keep urgent critical-path edits local only when delegation would block progress; otherwise prefer delegation first.
                  - listitem [ref=e389]: In handoff/final notes, summarize which subagents were used and what each one produced.
                - generic [ref=e390]:
                  - heading "AI CLI Integration" [level=2] [ref=e391]
                  - 'link "Permalink: AI CLI Integration" [ref=e392] [cursor=pointer]':
                    - /url: "#ai-cli-integration"
                    - img [ref=e393]
                - list [ref=e395]:
                  - listitem [ref=e396]:
                    - strong [ref=e397]: "Supported AI tools:"
                    - code [ref=e398]: Factory Droid
                    - text: ","
                    - code [ref=e399]: Codex CLI
                    - text: ","
                    - code [ref=e400]: OpenCode
                    - text: ", and"
                    - code [ref=e401]: Claude Code
                    - text: are supported. Codex CLI uses hook-only integration.
                  - listitem [ref=e402]:
                    - strong [ref=e403]: "Factory Droid hook format:"
                    - text: Only
                    - code [ref=e404]: droid-hook:*
                    - text: and
                    - code [ref=e405]: factory-droid-hook:*
                    - text: format patterns are recognized for Factory Droid. The
                    - code [ref=e406]: claude-hook:*
                    - text: format is not supported.
                  - listitem [ref=e407]:
                    - strong [ref=e408]: "Factory Droid detection commands:"
                    - text: Only
                    - code [ref=e409]: droid
                    - text: and
                    - code [ref=e410]: factory
                    - text: trigger Factory Droid session detection. Do not add
                    - code [ref=e411]: cc
                    - text: ","
                    - code [ref=e412]: claude
                    - text: ", or other AI CLI commands."
                  - listitem [ref=e413]:
                    - strong [ref=e414]: "OpenCode detection commands:"
                    - code [ref=e415]: opencode
                    - text: triggers OpenCode session detection. OpenCode is tracked through explicit launch detection, process-based status, visible UI/title parsing, notify/inbox status paths, and the Mergen-owned
                    - code [ref=e416]: mergen-opencode-status.js
                    - text: plugin. If OpenCode hangs at
                    - code [ref=e417]: Loading plugins
                    - text: ", inspect MCP startup load before disabling the plugin path."
                  - listitem [ref=e418]:
                    - strong [ref=e419]: "Codex CLI integration:"
                    - text: Codex uses strict hook-only integration with narrow visible-state exceptions. Mergen configures
                    - code [ref=e420]: hooks.json
                    - text: with
                    - code [ref=e421]: UserPromptSubmit
                    - text: ","
                    - code [ref=e422]: PreToolUse
                    - text: ","
                    - code [ref=e423]: PermissionRequest
                    - text: ","
                    - code [ref=e424]: PostToolUse
                    - text: ", and"
                    - code [ref=e425]: Stop
                    - text: "events that route to the Mergen bridge. The status transitions are:"
                    - list [ref=e426]:
                      - listitem [ref=e427]:
                        - code [ref=e428]: UserPromptSubmit
                        - text: ","
                        - code [ref=e429]: PreToolUse
                        - text: ", and"
                        - code [ref=e430]: PostToolUse
                        - text: hooks → Running (gray spinner)
                      - listitem [ref=e431]:
                        - code [ref=e432]: PermissionRequest
                        - text: hook →
                        - code [ref=e433]: ApprovalRequested
                        - text: / amber pulse (waiting for user)
                      - listitem [ref=e434]:
                        - code [ref=e435]: Stop
                        - text: hook → short debounce, then
                        - code [ref=e436]: TurnComplete
                        - text: / green pulse unless follow-up work arrives first
                      - listitem [ref=e437]:
                        - strong [ref=e438]: "Question prompt exception:"
                        - text: When Codex shows a question UI ("Question X/Y" with "enter to submit answer"), a narrow visible detection triggers
                        - code [ref=e439]: UserInputRequested
                        - text: attention with amber pulse. This handles the case where the turn is waiting for user input but the Stop hook hasn't fired yet.
                      - listitem [ref=e440]:
                        - strong [ref=e441]: "Interrupt banner exception:"
                        - text: When Codex renders the strict interrupted-turn banner (
                        - code [ref=e442]: conversation interrupted
                        - text: plus
                        - code [ref=e443]: /feedback
                        - text: ), narrow visible detection clears the running spinner without clearing the live Codex session/process tracking.
                      - listitem [ref=e444]: No notify, BEL, or title fallback is used for Codex.
                      - listitem [ref=e445]:
                        - strong [ref=e446]: "Routing:"
                        - text: Uses tool-specific
                        - code [ref=e447]: MERGEN_ADE_CODEX_INBOX_DIR
                        - text: env var to avoid collisions with OpenCode's shared
                        - code [ref=e448]: MERGEN_AI_INBOX_DIR
                        - text: .
                      - listitem [ref=e449]:
                        - strong [ref=e450]: "Hook configuration:"
                        - text: Managed hooks intentionally omit
                        - code [ref=e451]: statusMessage
                        - text: "to prevent Codex from displaying status text (e.g., \"Running Stop hook: Mergen: session stopped\") in the terminal."
                      - listitem [ref=e452]:
                        - strong [ref=e453]: "Redraw filtering:"
                        - text: The
                        - code [ref=e454]: CodexRedrawFilter
                        - text: only suppresses
                        - code [ref=e455]: ED3
                        - text: (scrollback erase) during synchronized update blocks. Cursor positioning sequences (
                        - code [ref=e456]: ESC[H
                        - text: ","
                        - code [ref=e457]: ESC[1;1H
                        - text: ","
                        - code [ref=e458]: ESC[f
                        - text: ) and
                        - code [ref=e459]: ED2
                        - text: (erase display) are preserved to prevent diagonal/stair-step rendering artifacts.
                      - listitem [ref=e460]:
                        - strong [ref=e461]: "Keyboard routing:"
                        - text: During question prompts (
                        - code [ref=e462]: UserInputRequested
                        - text: attention), raw keyboard events (including Escape, arrow keys, Tab) are routed to the terminal using the same mechanism as OpenCode/Factory Droid interactive attention states.
                  - listitem [ref=e463]:
                    - strong [ref=e464]: "Claude Code integration:"
                    - text: Claude uses title-based detection (Orca-compatible). Title patterns are detected via OSC title updates.
                  - listitem [ref=e465]:
                    - strong [ref=e466]: "UI labels:"
                    - text: Use "Droid", "Factory Droid", "Codex CLI", "OpenCode", and "Claude" terminology. Do not use "claude" lowercase references in user-facing text.
                  - listitem [ref=e467]:
