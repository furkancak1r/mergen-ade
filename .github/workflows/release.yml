name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Electron Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Test
        working-directory: electron
        run: npx vitest run

      - name: Build
        working-directory: electron
        run: npm run build

      - name: Package Windows portable ZIP
        shell: pwsh
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = "$env:RELEASE_REF_NAME"
          $asset = "mergen-ade-$version-windows-x64-portable.zip"
          New-Item -ItemType Directory -Force release-windows/scripts | Out-Null
          Copy-Item "electron/out/Mergen ADE.exe" "release-windows/mergen-ade.exe" -Force
          Copy-Item "scripts/install-factory-droid-hooks.ps1" "release-windows/scripts/" -Force
          Copy-Item "scripts/factory-droid-status-hook.ps1" "release-windows/scripts/" -Force
          Copy-Item "README.md" "release-windows/" -Force
          Compress-Archive -Path "release-windows/*" -DestinationPath $asset -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: mergen-ade-*-windows-x64-portable.zip
          if-no-files-found: error

  build-macos:
    name: Build Electron macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_ID_APP_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for name in \
            APPLE_DEVELOPER_ID_APP_CERT_BASE64 \
            APPLE_DEVELOPER_ID_APP_CERT_PASSWORD \
            APPLE_DEVELOPER_IDENTITY \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID \
            APPLE_NOTARY_API_PRIVATE_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Test
        working-directory: electron
        run: npx vitest run

      - name: Build
        working-directory: electron
        run: npm run build
        env:
          APPLE_DEVELOPER_ID_APP_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_BASE64 }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: electron/out/mergen-ade-*-macos-arm64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    if: needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Show packaged assets
        run: ls -al release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
